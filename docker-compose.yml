services:
  postgres:
    image: postgres:16-alpine
    container_name: dunnaa-db
    environment:
      POSTGRES_USER: dunnaa
      POSTGRES_PASSWORD: dunnaa_dev
      POSTGRES_DB: dunnaa
    ports:
      - "5455:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dunnaa"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dunnaa-redis
    ports:
      - "6385:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
