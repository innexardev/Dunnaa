version: "3.9"

services:
  # ─── API ──────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dunnaa-api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://dunnaa:${DB_PASSWORD:-dunnaa_dev}@db:5432/dunnaa
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - dunnaa-network

  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: dunnaa-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=dunnaa
      - POSTGRES_PASSWORD=${DB_PASSWORD:-dunnaa_dev}
      - POSTGRES_DB=dunnaa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dunnaa"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dunnaa-network

  # ─── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dunnaa-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dunnaa-network

  # ─── Migrations (run once) ────────────────────────────────────────────────────
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dunnaa-migrations
    command: ["alembic", "upgrade", "head"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://dunnaa:${DB_PASSWORD:-dunnaa_dev}@db:5432/dunnaa
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dunnaa-network
    profiles:
      - migrations

volumes:
  postgres_data:
  redis_data:

networks:
  dunnaa-network:
    driver: bridge
