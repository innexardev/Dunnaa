# DUNNAA — produção (Traefik + Cloudflare)
# Uso no servidor: cd deploy && docker compose up -d --build
#
# Pré-requisitos:
#   - Rede externa do Traefik (TRAEFIK_NETWORK)
#   - Arquivo .env com secrets (copie de .env.example)

name: dunnaa

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dunnaa}
      POSTGRES_USER: ${POSTGRES_USER:-dunnaa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - dunnaa_postgres_data:/var/lib/postgresql/data
    networks:
      - dunnaa-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dunnaa} -d ${POSTGRES_DB:-dunnaa}"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dunnaa_redis_data:/data
    networks:
      - dunnaa-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ../packages/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_MODE: production
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dunnaa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dunnaa}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["https://admin.dunnaa.com.br","https://dunnaa.com.br"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dunnaa-internal
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-fixelo_fixelo-network}"
      - "traefik.http.middlewares.dunnaa-api-compress.compress=true"
      - "traefik.http.middlewares.dunnaa-api-ratelimit.ratelimit.average=90"
      - "traefik.http.middlewares.dunnaa-api-ratelimit.ratelimit.burst=60"
      - "traefik.http.middlewares.dunnaa-api-ratelimit.ratelimit.period=1s"
      - "traefik.http.middlewares.dunnaa-api-ratelimit.ratelimit.sourcecriterion.requestheadername=CF-Connecting-IP"
      - "traefik.http.middlewares.dunnaa-api-inflight.inflightreq.amount=80"
      - "traefik.http.routers.dunnaa-api.rule=Host(`api.dunnaa.com.br`)"
      - "traefik.http.routers.dunnaa-api.entrypoints=websecure"
      - "traefik.http.routers.dunnaa-api.tls.certresolver=cloudflare"
      - "traefik.http.routers.dunnaa-api.middlewares=dunnaa-api-ratelimit,dunnaa-api-inflight,dunnaa-api-compress"
      - "traefik.http.routers.dunnaa-api.service=dunnaa-api-service"
      - "traefik.http.services.dunnaa-api-service.loadbalancer.server.port=8000"
      - "traefik.http.services.dunnaa-api-service.loadbalancer.passHostHeader=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.dunnaa.com.br/api/v1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_API_URL: https://api.dunnaa.com.br/api/v1
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dunnaa-internal
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-fixelo_fixelo-network}"
      - "traefik.http.middlewares.dunnaa-admin-compress.compress=true"
      - "traefik.http.middlewares.dunnaa-admin-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.dunnaa-admin-ratelimit.ratelimit.burst=70"
      - "traefik.http.middlewares.dunnaa-admin-ratelimit.ratelimit.period=1s"
      - "traefik.http.middlewares.dunnaa-admin-ratelimit.ratelimit.sourcecriterion.requestheadername=CF-Connecting-IP"
      - "traefik.http.middlewares.dunnaa-admin-inflight.inflightreq.amount=100"
      - "traefik.http.routers.dunnaa-admin.rule=Host(`admin.dunnaa.com.br`)"
      - "traefik.http.routers.dunnaa-admin.entrypoints=websecure"
      - "traefik.http.routers.dunnaa-admin.tls.certresolver=cloudflare"
      - "traefik.http.routers.dunnaa-admin.middlewares=dunnaa-admin-ratelimit,dunnaa-admin-inflight,dunnaa-admin-compress"
      - "traefik.http.routers.dunnaa-admin.service=dunnaa-admin-service"
      - "traefik.http.services.dunnaa-admin-service.loadbalancer.server.port=3000"
      - "traefik.http.services.dunnaa-admin-service.loadbalancer.passHostHeader=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Site público dunnaa.com.br — descomente quando tiver landing (Next/static/nginx)
  # site:
  #   image: nginx:alpine
  #   volumes:
  #     - ./site/dist:/usr/share/nginx/html:ro
  #   networks:
  #     - traefik-public
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.docker.network=${TRAEFIK_NETWORK:-fixelo_fixelo-network}"
  #     - "traefik.http.routers.dunnaa-site.rule=Host(`dunnaa.com.br`) || Host(`www.dunnaa.com.br`)"
  #     - "traefik.http.routers.dunnaa-site.entrypoints=websecure"
  #     - "traefik.http.routers.dunnaa-site.tls.certresolver=cloudflare"
  #     - "traefik.http.services.dunnaa-site.loadbalancer.server.port=80"

volumes:
  dunnaa_postgres_data:
  dunnaa_redis_data:

networks:
  dunnaa-internal:
    driver: bridge
  traefik-public:
    external: true
    name: ${TRAEFIK_NETWORK:-fixelo_fixelo-network}
